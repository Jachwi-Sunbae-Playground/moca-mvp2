services:
  mysql:
    image: mysql:8.4.10
    environment:
      MYSQL_DATABASE: ${DB_NAME:-jachwi_sunbae}
      MYSQL_USER: ${DB_USERNAME:-jachwi_sunbae}
      MYSQL_PASSWORD: ${DB_PASSWORD:-local_password}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-local_root_password}
      TZ: Asia/Seoul
    ports:
      - "${DB_PORT:-3306}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p$$MYSQL_ROOT_PASSWORD"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 20s

volumes:
  mysql-data:
