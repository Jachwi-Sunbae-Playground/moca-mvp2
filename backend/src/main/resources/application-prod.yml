spring:
  datasource:
    url: jdbc:mysql://${DB_HOST}:${DB_PORT}/${DB_NAME}?sslMode=REQUIRED&connectionTimeZone=%2B00:00&forceConnectionTimeZoneToSession=true&preserveInstants=true
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

# project-app 보안 그룹은 project-lb 에서 오는 80·443 만 허용한다. 8080 은 열려 있지 않다.
# 공용 보안 그룹이라 규칙을 추가하면 다른 팀 인스턴스에도 열리므로 애플리케이션이 80 을 직접 듣는다.
# 비루트 계정으로 80 에 바인딩하기 위해 systemd 유닛에서 CAP_NET_BIND_SERVICE 를 준다.
server:
  port: 80

logging:
  level:
    root: info
