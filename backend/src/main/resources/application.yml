spring:
  application:
    name: moca-mvp2-backend
  profiles:
    default: local
  sql:
    init:
      mode: never
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB

auth:
  jwt:
    secret: ${JWT_SECRET:local-demo-jwt-secret-at-least-32-bytes}
    issuer: jachwi-sunbae
    audience: jachwi-sunbae-api
    access-token-seconds: 43200
  nickname:
    max-failures: ${NICKNAME_AUTH_MAX_FAILURES:5}
    failure-window-seconds: ${NICKNAME_AUTH_FAILURE_WINDOW_SECONDS:600}

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}

photo:
  storage:
    region: ${PHOTO_STORAGE_REGION:us-east-1}
    bucket: ${PHOTO_STORAGE_BUCKET:moca-mvp2-photos}
    key-prefix: ${PHOTO_STORAGE_KEY_PREFIX:}

map:
  provider:
    mode: ${MAP_PROVIDER_MODE:demo}
  kakao:
    rest-api-key: ${KAKAO_REST_API_KEY:}
  bus-stops:
    provider: ${BUS_STOP_PROVIDER:none}
    tago:
      service-key: ${DATA_GO_KR_SERVICE_KEY:}
  cache-ttl-seconds: ${MAP_CACHE_TTL_SECONDS:600}
  connect-timeout-millis: ${MAP_CONNECT_TIMEOUT_MILLIS:2000}
  read-timeout-millis: ${MAP_READ_TIMEOUT_MILLIS:5000}

demo:
  seed:
    enabled: ${DEMO_SEED_ENABLED:true}
    nickname: ${DEMO_MEMBER_NAME:이자취}

management:
  endpoints:
    web:
      exposure:
        include:
          - health
          - info
