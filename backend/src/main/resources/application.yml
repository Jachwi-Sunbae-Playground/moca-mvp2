spring:
  application:
    name: jachwi-sunbae-backend
  profiles:
    default: local
  sql:
    init:
      mode: never
  flyway:
    enabled: true
    baseline-on-migrate: false
    clean-disabled: true
    locations: classpath:db/migration
    out-of-order: false
    validate-on-migrate: true
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 11MB

auth:
  jwt:
    secret: ${JWT_SECRET_BASE64}
    issuer: jachwi-sunbae
    audience: jachwi-sunbae-api
    access-token-seconds: 43200
  google:
    client-id: ${GOOGLE_OAUTH_CLIENT_ID}
    client-secret: ${GOOGLE_OAUTH_CLIENT_SECRET}

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS}

photo:
  storage:
    region: ${PHOTO_STORAGE_REGION}
    bucket: ${PHOTO_STORAGE_BUCKET}
    key-prefix: ${PHOTO_STORAGE_KEY_PREFIX:}

management:
  endpoints:
    web:
      exposure:
        include:
          - health
          - info
