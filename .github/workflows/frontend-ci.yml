name: Frontend CI

on:
  pull_request:
    branches:
      - main
      - develop
  push:
    branches:
      - main
      - develop
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: frontend-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check frontend
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    env:
      API_BASE_URL: http://localhost:8080
      GOOGLE_CLIENT_ID: ci-example-client-id.apps.googleusercontent.com
      GOOGLE_REDIRECT_URI: http://localhost:3000/oauth/google/callback

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Detect frontend changes
        id: changes
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          if [[ "${EVENT_NAME}" == "workflow_dispatch" ]]; then
            echo "frontend=true" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          if [[ "${EVENT_NAME}" == "pull_request" ]]; then
            CHANGED_FILES="$(git diff --name-only "${BASE_SHA}...${HEAD_SHA}")"
          else
            CHANGED_FILES="$(git diff --name-only "${BASE_SHA}" "${HEAD_SHA}")"
          fi

          if grep -Eq '^(frontend/|\.github/workflows/frontend-ci\.yml$)' <<< "${CHANGED_FILES}"; then
            echo "frontend=true" >> "${GITHUB_OUTPUT}"
          else
            echo "frontend=false" >> "${GITHUB_OUTPUT}"
          fi
        working-directory: .

      - name: Report skipped frontend check
        if: steps.changes.outputs.frontend != 'true'
        run: echo "프론트엔드 변경이 없어 검사를 생략한다."
        working-directory: .

      - name: Set up Node.js
        if: steps.changes.outputs.frontend == 'true'
        uses: actions/setup-node@v6
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        if: steps.changes.outputs.frontend == 'true'
        run: npm ci

      - name: Check types
        if: steps.changes.outputs.frontend == 'true'
        run: npm run typecheck

      - name: Lint
        if: steps.changes.outputs.frontend == 'true'
        run: npm run lint

      - name: Check formatting
        if: steps.changes.outputs.frontend == 'true'
        run: npm run format:check

      - name: Test
        if: steps.changes.outputs.frontend == 'true'
        run: npm run test

      - name: Build
        if: steps.changes.outputs.frontend == 'true'
        run: npm run build
