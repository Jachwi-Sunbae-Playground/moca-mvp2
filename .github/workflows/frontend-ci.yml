name: Frontend CI

# 필수 상태 검사로 지정하므로 경로 필터를 두지 않는다. 워크플로 자체가 건너뛰어지면
# 검사 결과가 Pending에 남아 frontend 변경이 없는 PR도 병합할 수 없게 된다.
on:
  pull_request:
    branches:
      - main
      - develop
  push:
    branches:
      - main
      - develop
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: frontend-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check frontend
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    env:
      API_BASE_URL: http://localhost:8080
      GOOGLE_CLIENT_ID: ci-example-client-id.apps.googleusercontent.com
      GOOGLE_REDIRECT_URI: http://localhost:3000/oauth/google/callback

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Check types
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build
