name: Docs Check

# 경로 필터를 두지 않는다. 검사가 몇 초로 끝나고, 필터를 유지하는 비용보다
# 검사 대상이 늘었을 때 필터를 빠뜨리는 위험이 크다. 필수 체크로 지정했을 때
# 필터에 걸리지 않은 PR이 검사를 기다리며 병합되지 못하는 문제도 없다.
on:
  pull_request:
    branches:
      - main
      - develop
  push:
    branches:
      - main
      - develop
  workflow_dispatch:

concurrency:
  group: docs-check-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Check docs consistency
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Check docs consistency
        run: python3 .github/scripts/check_docs.py
