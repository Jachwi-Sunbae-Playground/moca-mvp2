name: Deploy production

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: "MVP2 기능 개발 완료 후 DEPLOY를 입력한다"
        required: true
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and deploy
    if: inputs.confirmation == 'DEPLOY' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build backend without repeated tests
        env:
          SOURCE_COMMIT_ID: ${{ github.sha }}
        run: ./backend/gradlew -p backend bootJar --no-daemon -x test

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend
        working-directory: frontend
        env:
          API_BASE_URL: https://${{ vars.MOCA_DOMAIN }}
          AUTH_MODE: google
          GOOGLE_CLIENT_ID: ${{ vars.GOOGLE_CLIENT_ID }}
          GOOGLE_REDIRECT_URI: https://${{ vars.MOCA_DOMAIN }}/oauth/google/callback
          MAP_PROVIDER_MODE: kakao
          KAKAO_MAP_JAVASCRIPT_KEY: ${{ vars.KAKAO_MAP_JAVASCRIPT_KEY }}
        run: |
          npm ci
          npm run build

      - name: Assemble release
        run: |
          mkdir -p release/backend release/frontend
          cp backend/build/libs/moca-mvp2-backend-0.0.1-SNAPSHOT.jar release/backend/app.jar
          cp -R frontend/dist release/frontend/dist
          mkdir -p release/backend/src/main/resources/db
          cp -R backend/src/main/resources/db/init release/backend/src/main/resources/db/init
          cp -R deploy release/deploy
          tar -czf "moca-${GITHUB_SHA}.tgz" -C release .

      - name: Configure AWS credentials with OIDC
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Upload release
        run: aws s3 cp "moca-${GITHUB_SHA}.tgz" "s3://${{ vars.RELEASE_BUCKET }}/releases/${GITHUB_SHA}.tgz" --only-show-errors

      - name: Start deployment through SSM
        env:
          INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
          RELEASE_BUCKET: ${{ vars.RELEASE_BUCKET }}
        run: |
          ssm_parameters="$(jq -cn \
            --arg command "sudo /usr/local/bin/moca-deploy ${RELEASE_BUCKET} releases/${GITHUB_SHA}.tgz ${GITHUB_SHA}" \
            '{commands: [$command]}')"
          command_id="$(aws ssm send-command \
            --instance-ids "${INSTANCE_ID}" \
            --document-name AWS-RunShellScript \
            --parameters "${ssm_parameters}" \
            --query 'Command.CommandId' \
            --output text)"
          if ! aws ssm wait command-executed --command-id "${command_id}" --instance-id "${INSTANCE_ID}"; then
            aws ssm get-command-invocation --command-id "${command_id}" --instance-id "${INSTANCE_ID}" || true
            exit 1
          fi
          aws ssm get-command-invocation --command-id "${command_id}" --instance-id "${INSTANCE_ID}"
